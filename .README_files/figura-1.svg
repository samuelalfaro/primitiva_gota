  <title
     id="title698">Geometría base de la gota (secciones elípticas + envolvente continua)</title>
  <desc
     id="desc700">Envolvente continua usando los arcos exteriores de las elipses extremas. Líneas de banda desde puntos de contacto a los centros. Bézier y elipses completas en discontinuo (parte interna visible).</desc>
